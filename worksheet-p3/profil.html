<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies List</title>
</head>
<body>
    <header>
    <h1>Movies</h1>

    <nav aria-label="Main navigation">
        <ul>
            <li><a href="#movie-list">List of Movies</a></li>
            <li><a href="#add-movie">Add Movie</a></li>
            <li><a href="#recommendations">Movie Recommendations</a></li>
        </ul>
    </nav>
</header>

<main>

    <section id="movie-list">
        <h2>List of Movies</h2>
        <table>
            <caption>List of movies I've watched</caption>

            <thead>
                <tr>
                    <th scope="col">Title</th>
                    <th scope="col">Year</th>
                    <th scope="col">Genre</th>
                    <th scope="col">Rating</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <th scope="row">Exit</th>
                    <td>2019</td>
                    <td>Comedy</td>
                    <td>9/10</td>
                </tr>

                <tr>
                    <th scope="row">Midnight Runner</th>
                    <td>2017</td>
                    <td>Comedy</td>
                    <td>9/10</td>
                </tr>

                <tr>
                    <th scope="row">The Shadow's Edge</th>
                    <td>2025</td>
                    <td>Action</td>
                    <td>9/10</td>
                </tr>
            </tbody>
        </table>
        <!-- Image -->
        <figure>
            <img src="movie.jpg" alt="A collection of movie posters" width="640" height="600">
            <figcaption>A list of several movie posters</figcaption>
        </figure>
    </section>

    <section id="add-movie">
        <h2>Add Movie</h2>
    </section>

</main>

<footer>
    <p>Rekyan Noviandary Widyaningsih · 25523050 · 2026</p>
</footer>

</body>
</html>
